name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  swift:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - name: Show Swift version
        run: swift --version
      - name: Test
        run: swift test
      - name: Release build
        run: swift build -c release

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/dji-viewer
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Test and build
        run: ./gradlew testDebugUnitTest assembleDebug
